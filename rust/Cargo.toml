[package]
name = "lima"
version = "0.1.1"
edition = "2021"
description = "Lima frontmatter parser — LIMA Is Metadata Annotation"
license = "ISC"
repository = "https://github.com/limaformat/lima"
homepage = "https://limaformat.dev"
documentation = "https://docs.rs/lima"
keywords = ["frontmatter", "parser", "yaml", "markdown"]
categories = ["parser-implementations", "text-processing"]
readme = "README.md"

# No runtime dependencies — matches the TypeScript implementation's
# dependency-free stance. Everything below is dev-only (fixture loading for
# tests/corpus.rs, yaml-rust2 for benches/vs_yaml.rs), never shipped in the
# published crate.
[dev-dependencies]
serde_json = "1"
yaml-rust2 = "0.11"

[[bench]]
name = "vs_yaml"
harness = false

[[bench]]
name = "cross_language"
harness = false
